  test-php-versions:
    name: PHP ${{ matrix.php }} / WP 7.0 (latest)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

